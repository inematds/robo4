<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" font-family="Inter, Arial, sans-serif">
  <title>Calibration: servo position at 90 degrees</title>
  <rect width="1100" height="520" rx="16" fill="#0c0c10"/>
  <text x="40" y="52" fill="#e9e9ee" font-size="28" font-weight="700" font-family="Sora, Inter, sans-serif">Calibration in 3 steps</text>

  <!-- step 1 -->
  <g transform="translate(40,90)">
    <rect width="320" height="390" rx="14" fill="#16161e" stroke="#272730" stroke-width="1.5"/>
    <circle cx="34" cy="36" r="18" fill="#FACC15"/><text x="34" y="42" fill="#1a1206" font-size="17" font-weight="700" text-anchor="middle">1</text>
    <text x="64" y="42" fill="#e9e9ee" font-size="18" font-weight="700">Servos at 90°</text>
    <text x="24" y="78" fill="#9a9aa6" font-size="15">Upload the firmware/montagem</text>
    <text x="24" y="100" fill="#9a9aa6" font-size="15">without the servo horns attached.</text>
    <!-- servo -->
    <rect x="100" y="150" width="120" height="70" rx="8" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="190" cy="185" r="14" fill="#e9e9ee"/>
    <path d="M190,185 L190,135" stroke="#FACC15" stroke-width="4" stroke-dasharray="5 5"/>
    <text x="160" y="270" fill="#e9e9ee" font-size="16" text-anchor="middle">shaft held at 90°</text>
    <text x="24" y="330" fill="#9a9aa6" font-size="15">All 8 turn on one at a time</text>
    <text x="24" y="352" fill="#9a9aa6" font-size="15">and stay locked in place.</text>
  </g>

  <!-- step 2 -->
  <g transform="translate(390,90)">
    <rect width="320" height="390" rx="14" fill="#16161e" stroke="#272730" stroke-width="1.5"/>
    <circle cx="34" cy="36" r="18" fill="#FACC15"/><text x="34" y="42" fill="#1a1206" font-size="17" font-weight="700" text-anchor="middle">2</text>
    <text x="64" y="42" fill="#e9e9ee" font-size="18" font-weight="700">Attach the leg</text>
    <text x="24" y="78" fill="#9a9aa6" font-size="15">Keep the thigh vertical, with the shin</text>
    <text x="24" y="100" fill="#9a9aa6" font-size="15">at a right angle to the thigh.</text>
    <line x1="140" y1="140" x2="140" y2="250" stroke="#e9e9ee" stroke-width="12" stroke-linecap="round"/>
    <line x1="140" y1="250" x2="250" y2="250" stroke="#9a9aa6" stroke-width="10" stroke-linecap="round"/>
    <circle cx="140" cy="140" r="14" fill="#1e3a8a" stroke="#60a5fa" stroke-width="3"/>
    <circle cx="140" cy="250" r="13" fill="#1e3a8a" stroke="#60a5fa" stroke-width="3"/>
    <path d="M140,222 L168,222 L168,250" fill="none" stroke="#FACC15" stroke-width="3"/>
    <text x="176" y="238" fill="#FACC15" font-size="15" font-weight="700">90°</text>
    <text id="frente" x="300" y="312" fill="#FACC15" font-size="15" font-weight="700" text-anchor="end">robot front →</text>
    <text x="90" y="200" fill="#e9e9ee" font-size="14" text-anchor="end">thigh</text>
    <text x="200" y="280" fill="#e9e9ee" font-size="14" text-anchor="middle">shin</text>
    <text x="24" y="330" fill="#9a9aa6" font-size="15">The horn has teeth: choose</text>
    <text x="24" y="352" fill="#9a9aa6" font-size="15">the tooth closest to the angle.</text>
  </g>

  <!-- step 3 -->
  <g transform="translate(740,90)">
    <rect width="320" height="390" rx="14" fill="#16161e" stroke="#272730" stroke-width="1.5"/>
    <circle cx="34" cy="36" r="18" fill="#FACC15"/><text x="34" y="42" fill="#1a1206" font-size="17" font-weight="700" text-anchor="middle">3</text>
    <text x="64" y="42" fill="#e9e9ee" font-size="18" font-weight="700">Fine-tune</text>
    <text x="24" y="78" fill="#9a9aa6" font-size="15">Upload firmware/robo4, open</text>
    <text x="24" y="100" fill="#9a9aa6" font-size="15">the Serial Monitor, and type:</text>
    <g font-family="JetBrains Mono, monospace" font-size="16">
      <rect x="24" y="126" width="272" height="150" rx="10" fill="#0c0c10" stroke="#272730"/>
      <text x="40" y="156" fill="#FACC15">m</text><text x="80" y="156" fill="#9a9aa6">everything at 90°</text>
      <text x="40" y="186" fill="#FACC15">o 0 1 -6</text><text x="150" y="186" fill="#9a9aa6">FE knee −6°</text>
      <text x="40" y="216" fill="#FACC15">p</text><text x="80" y="216" fill="#9a9aa6">show adjustments</text>
      <text x="40" y="246" fill="#FACC15">g</text><text x="80" y="246" fill="#9a9aa6">save to EEPROM</text>
    </g>
    <text x="24" y="320" fill="#9a9aa6" font-size="15">Repeat until all 4 legs are</text>
    <text x="24" y="342" fill="#9a9aa6" font-size="15">the same. Limit: ±30° per joint.</text>
  </g>
  <text x="550" y="505" fill="#FACC15" font-size="15" font-weight="700" text-anchor="middle">The shin points to the FRONT.</text>
</svg>