<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Inter, Arial, sans-serif">
  <title>Mapa das pernas e pinos do robo4 (vista de cima)</title>
  <rect width="1000" height="700" rx="16" fill="#0c0c10"/>
  <text x="40" y="52" fill="#e9e9ee" font-size="28" font-weight="700" font-family="Sora, Inter, sans-serif">Mapa das pernas (vista de cima)</text>
  <text x="40" y="82" fill="#9a9aa6" font-size="16">Número da perna no código · pino do quadril / pino do joelho · sinal do servo</text>

  <!-- frente -->
  <text x="500" y="128" fill="#FACC15" font-size="17" font-weight="700" text-anchor="middle">▲ FRENTE</text>
  <!-- corpo -->
  <rect x="380" y="150" width="240" height="420" rx="18" fill="#16161e" stroke="#9a9aa6" stroke-width="2"/>
  <rect x="420" y="250" width="160" height="210" rx="10" fill="#101a2b" stroke="#3b82f6" stroke-width="2"/>
  <text x="500" y="345" fill="#e9e9ee" font-size="16" text-anchor="middle">Uno +</text>
  <text x="500" y="367" fill="#e9e9ee" font-size="16" text-anchor="middle">Sensor Shield</text>
  <text x="500" y="540" fill="#9a9aa6" font-size="14" text-anchor="middle">bateria embaixo</text>

  <!-- quadris (servos) -->
  <g fill="#1e3a8a" stroke="#60a5fa" stroke-width="2">
    <rect x="350" y="170" width="56" height="40" rx="6"/>
    <rect x="594" y="170" width="56" height="40" rx="6"/>
    <rect x="350" y="510" width="56" height="40" rx="6"/>
    <rect x="594" y="510" width="56" height="40" rx="6"/>
  </g>
  <!-- pernas -->
  <g stroke="#9a9aa6" stroke-width="10" stroke-linecap="round">
    <line x1="350" y1="190" x2="290" y2="190"/>
    <line x1="650" y1="190" x2="710" y2="190"/>
    <line x1="350" y1="530" x2="290" y2="530"/>
    <line x1="650" y1="530" x2="710" y2="530"/>
  </g>

  <!-- cartões -->
  <g font-size="16">
    <g transform="translate(40,140)">
      <rect width="240" height="104" rx="12" fill="#16161e" stroke="#FACC15" stroke-width="2"/>
      <text x="16" y="32" fill="#FACC15" font-size="19" font-weight="700">0 · FE</text>
      <text x="80" y="32" fill="#9a9aa6" font-size="15">frente esquerda</text>
      <text x="16" y="62" fill="#e9e9ee">quadril D2 · sinal +1</text>
      <text x="16" y="88" fill="#e9e9ee">joelho  D3 · sinal −1</text>
    </g>
    <g transform="translate(720,140)">
      <rect width="240" height="104" rx="12" fill="#16161e" stroke="#FACC15" stroke-width="2"/>
      <text x="16" y="32" fill="#FACC15" font-size="19" font-weight="700">1 · FD</text>
      <text x="80" y="32" fill="#9a9aa6" font-size="15">frente direita</text>
      <text x="16" y="62" fill="#e9e9ee">quadril D4 · sinal −1</text>
      <text x="16" y="88" fill="#e9e9ee">joelho  D5 · sinal +1</text>
    </g>
    <g transform="translate(40,478)">
      <rect width="240" height="104" rx="12" fill="#16161e" stroke="#FACC15" stroke-width="2"/>
      <text x="16" y="32" fill="#FACC15" font-size="19" font-weight="700">2 · TE</text>
      <text x="80" y="32" fill="#9a9aa6" font-size="15">trás esquerda</text>
      <text x="16" y="62" fill="#e9e9ee">quadril D6 · sinal +1</text>
      <text x="16" y="88" fill="#e9e9ee">joelho  D7 · sinal −1</text>
    </g>
    <g transform="translate(720,478)">
      <rect width="240" height="104" rx="12" fill="#16161e" stroke="#FACC15" stroke-width="2"/>
      <text x="16" y="32" fill="#FACC15" font-size="19" font-weight="700">3 · TD</text>
      <text x="80" y="32" fill="#9a9aa6" font-size="15">trás direita</text>
      <text x="16" y="62" fill="#e9e9ee">quadril D8 · sinal −1</text>
      <text x="16" y="88" fill="#e9e9ee">joelho  D9 · sinal +1</text>
    </g>
  </g>
  <text x="40" y="630" fill="#e9e9ee" font-size="16">Pares do trote: <tspan fill="#FACC15" font-weight="700">FE + TD</tspan> sobem juntos, depois <tspan fill="#FACC15" font-weight="700">FD + TE</tspan>.</text>
  <text x="40" y="660" fill="#9a9aa6" font-size="15">O lado direito é espelhado, por isso o sinal inverte. Se uma junta girar ao contrário, troque o sinal em SENTIDO[][] no código.</text>
</svg>
