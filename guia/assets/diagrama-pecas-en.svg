<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 896" font-family="Inter, Arial, sans-serif">
  <title>Parts with dimensions: chassis, thigh, and shin</title>
  <rect width="1200" height="896" rx="16" fill="#0c0c10"/>
  <text x="40" y="52" fill="#e9e9ee" font-size="28" font-weight="700" font-family="Sora, Inter, sans-serif">Parts with dimensions (mm)</text>
  <text x="40" y="82" fill="#9a9aa6" font-size="16">Scale: 3 px = 1 mm. Cut from 3 mm acrylic/MDF or print at 3 mm thick. Reference dimensions: check with calipers.</text>
  <g stroke-width="2" fill="none">
    <!-- side wall (2x) -->
    <rect x="40" y="130" width="420" height="105" rx="4" stroke="#FACC15" fill="#16161e"/>
    <rect x="82" y="161" width="69" height="38" rx="2" stroke="#60a5fa" fill="#0c0c10"/>
    <rect x="349" y="161" width="69" height="38" rx="2" stroke="#60a5fa" fill="#0c0c10"/>
    <circle cx="100" cy="180" r="4" stroke="#FACC15"/>
    <circle cx="74.5" cy="180" r="3" stroke="#e9e9ee"/><circle cx="158" cy="180" r="3" stroke="#e9e9ee"/><circle cx="342" cy="180" r="3" stroke="#e9e9ee"/><circle cx="425.5" cy="180" r="3" stroke="#e9e9ee"/>
    <circle cx="400" cy="180" r="4" stroke="#FACC15"/>
    <!-- base -->
    <rect x="40" y="300" width="420" height="240" rx="4" stroke="#FACC15" fill="#16161e"/>
    <rect x="147" y="340" width="206" height="160" rx="6" stroke="#3b82f6" stroke-dasharray="6 5"/>
    <g stroke="#e9e9ee"><circle cx="189" cy="492" r="5"/><circle cx="193" cy="348" r="5"/><circle cx="345" cy="477" r="5"/><circle cx="345" cy="393" r="5"/></g>
    <!-- thigh -->
    <rect x="554" y="120" width="60" height="245" rx="10" stroke="#FACC15" fill="#16161e"/>
    <circle cx="584" cy="144" r="5" stroke="#e9e9ee"/>
    <rect x="565" y="259" width="38" height="69" rx="2" stroke="#60a5fa" fill="#0c0c10"/>
    <circle cx="584" cy="251" r="3" stroke="#e9e9ee"/><circle cx="584" cy="334" r="3" stroke="#e9e9ee"/>
    <circle cx="584" cy="309" r="4" stroke="#FACC15"/>
    <!-- shin -->
    <rect x="700" y="120" width="42" height="222" rx="10" stroke="#FACC15" fill="#16161e"/>
    <circle cx="721" cy="144" r="5" stroke="#e9e9ee"/>
    <circle cx="721" cy="324" r="5" stroke="#e9e9ee"/>
  </g>
  <!-- dimensions -->
  <g stroke="#9a9aa6" stroke-width="1.5">
    <line x1="100" y1="250" x2="400" y2="250"/><line x1="100" y1="244" x2="100" y2="256"/><line x1="400" y1="244" x2="400" y2="256"/>
    <line x1="40" y1="118" x2="460" y2="118"/>
    <line x1="472" y1="130" x2="472" y2="235"/>
    <line x1="40" y1="556" x2="460" y2="556"/>
    <line x1="472" y1="300" x2="472" y2="540"/>
    <line x1="630" y1="144" x2="630" y2="309"/><line x1="624" y1="144" x2="636" y2="144"/><line x1="624" y1="309" x2="636" y2="309"/>
    <line x1="756" y1="144" x2="756" y2="324"/><line x1="750" y1="144" x2="762" y2="144"/><line x1="750" y1="324" x2="762" y2="324"/>
  </g>
  <g fill="#e9e9ee" font-size="15">
    <text x="40" y="112">Side wall (cut 2) · 140 × 35</text>
    <text x="478" y="188">35</text>
    <text x="250" y="272" text-anchor="middle">100 between hip axes</text>
    <text x="152" y="215" fill="#60a5fa" font-size="14">servo slot 23 × 12,5</text>
    <text x="40" y="292">Base (cut 1) · 140 × 80</text>
    <text x="478" y="425">80</text>
    <text x="250" y="576" text-anchor="middle">140</text>
    <text x="250" y="430" fill="#60a5fa" font-size="14" text-anchor="middle">Arduino Uno 68,6 × 53,3</text>
    <text x="250" y="450" fill="#9a9aa6" font-size="14" text-anchor="middle">4 M3 holes aligned with board holes</text>
    <text x="554" y="112">Thigh (4) · 20 × 82</text>
    <text x="638" y="232">55</text>
    <text x="700" y="112" fill="#e9e9ee">Shin (4) · 14 × 74</text>
    <text x="764" y="240">60</text>
    <text x="608" y="388" fill="#9a9aa6" font-size="14" text-anchor="middle">servo slot</text>
    <text x="608" y="406" fill="#9a9aa6" font-size="14" text-anchor="middle">for the knee</text>
    <text x="721" y="364" fill="#9a9aa6" font-size="14" text-anchor="middle">foot (M3 +</text>
    <text x="721" y="382" fill="#9a9aa6" font-size="14" text-anchor="middle">foot cap)</text>
  </g>
  <!-- legend -->
  <g font-size="14" fill="#9a9aa6">
    <circle cx="48" cy="610" r="5" fill="none" stroke="#FACC15" stroke-width="2"/><text x="62" y="615">servo axis (pivot center)</text>
    <circle cx="300" cy="610" r="5" fill="none" stroke="#e9e9ee" stroke-width="2"/><text x="314" y="615">hole for the arm (horn) or screw</text>
    <rect x="42" y="632" width="14" height="10" fill="none" stroke="#60a5fa" stroke-width="2"/><text x="62" y="642">slot where the servo fits (the axis is 6 mm from one end)</text>
  </g>
  <!-- panel -->
  <g transform="translate(830,120)">
    <rect width="330" height="560" rx="14" fill="#16161e" stroke="#272730" stroke-width="1.5"/>
    <text x="22" y="38" fill="#FACC15" font-size="18" font-weight="700">MG90S (typical)</text>
    <g fill="#e9e9ee" font-size="15">
      <text x="22" y="70">body 22,8 × 12,2 × 28,5</text>
      <text x="22" y="96">end-to-end tabs 32,5</text>
      <text x="22" y="122">tab holes: 27,8 between centers</text>
      <text x="22" y="148">axis ~6 from the end of the body</text>
      <text x="22" y="174">torque ~2,2 kg·cm at 6 V</text>
    </g>
    <text x="22" y="220" fill="#FACC15" font-size="18" font-weight="700">How the parts connect</text>
    <g fill="#e9e9ee" font-size="15">
      <text x="22" y="252">1. Hip servo in the wall slot,</text>
      <text x="22" y="274">   with the axis facing out.</text>
      <text x="22" y="302">2. Single-arm horn screwed to the top</text>
      <text x="22" y="324">   of the thigh (2 M2 screws).</text>
      <text x="22" y="352">3. Knee servo in the thigh slot.</text>
      <text x="22" y="380">4. Knee horn on top of the shin.</text>
      <text x="22" y="408">5. Attach the walls to the base with</text>
      <text x="22" y="430">   brackets or glue, at a right angle.</text>
    </g>
    <text x="22" y="476" fill="#9a9aa6" font-size="14">Changed 55 or 60? Update L1 and L2</text>
    <text x="22" y="496" fill="#9a9aa6" font-size="14">in firmware/robo4/robo4.ino.</text>
    <text x="22" y="530" fill="#9a9aa6" font-size="14">Target assembled weight: 350–450 g.</text>
  </g>
  <g id="cotas" font-size="14" fill="#e9e9ee">
    <text x="40" y="680" fill="#FACC15" font-size="16" font-weight="700">Marking dimensions (mm, from the top-left corner of each part)</text>
    <text x="40" y="706">Wall: axes at 20 and 120 from the end, 20 below the top. Slot 23 × 12.5, from height 13.75 to 26.25; the axis is 6 from the slot end closest to the</text>
    <text x="40" y="726">wall end.</text>
    <text x="40" y="750">Hip servo tabs: M2 holes at 11.5 and 39.3 (rear servo) and at 100.7 and 128.5 (front servo), at axis height.</text>
    <text x="40" y="774">Base: Uno centered, board corner at (35.7; 13.4). Uno holes from that corner: (14.0; 2.5) (15.3; 50.7) (66.1; 7.6) (66.1; 35.5). 25 mm M3 standoffs:</text>
    <text x="40" y="794">the Uno sits above the hip servos.</text>
    <text x="40" y="818">Thigh: horn hole 8 from the top, centered. Knee axis 63 from the top; slot from 46.2 to 69 (the servo body runs up the thigh, axis at the bottom); M2</text>
    <text x="40" y="838">tab holes at 43.7 and 71.5.</text>
    <text x="40" y="862">Shin: horn 8 from the top, foot hole 60 below (6 from the bottom edge).</text>
  </g>
</svg>