<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 896" font-family="Inter, Arial, sans-serif">
  <title>Piezas con medidas: chasis, muslo y espinilla</title>
  <rect width="1200" height="896" rx="16" fill="#0c0c10"/>
  <text x="40" y="52" fill="#e9e9ee" font-size="28" font-weight="700" font-family="Sora, Inter, sans-serif">Piezas con medidas (mm)</text>
  <text x="40" y="82" fill="#9a9aa6" font-size="16">Escala: 3 px = 1 mm. Corta en acrílico/MDF de 3 mm o imprime con 3 mm de espesor. Medidas de referencia: comprueba con un calibrador.</text>
  <g stroke-width="2" fill="none">
    <!-- pared lateral (2x) -->
    <rect x="40" y="130" width="420" height="105" rx="4" stroke="#FACC15" fill="#16161e"/>
    <rect x="82" y="161" width="69" height="38" rx="2" stroke="#60a5fa" fill="#0c0c10"/>
    <rect x="349" y="161" width="69" height="38" rx="2" stroke="#60a5fa" fill="#0c0c10"/>
    <circle cx="100" cy="180" r="4" stroke="#FACC15"/>
    <circle cx="74.5" cy="180" r="3" stroke="#e9e9ee"/><circle cx="158" cy="180" r="3" stroke="#e9e9ee"/><circle cx="342" cy="180" r="3" stroke="#e9e9ee"/><circle cx="425.5" cy="180" r="3" stroke="#e9e9ee"/>
    <circle cx="400" cy="180" r="4" stroke="#FACC15"/>
    <!-- base -->
    <rect x="40" y="300" width="420" height="240" rx="4" stroke="#FACC15" fill="#16161e"/>
    <rect x="147" y="340" width="206" height="160" rx="6" stroke="#3b82f6" stroke-dasharray="6 5"/>
    <g stroke="#e9e9ee"><circle cx="189" cy="492" r="5"/><circle cx="193" cy="348" r="5"/><circle cx="345" cy="477" r="5"/><circle cx="345" cy="393" r="5"/></g>
    <!-- muslo -->
    <rect x="554" y="120" width="60" height="245" rx="10" stroke="#FACC15" fill="#16161e"/>
    <circle cx="584" cy="144" r="5" stroke="#e9e9ee"/>
    <rect x="565" y="259" width="38" height="69" rx="2" stroke="#60a5fa" fill="#0c0c10"/>
    <circle cx="584" cy="251" r="3" stroke="#e9e9ee"/><circle cx="584" cy="334" r="3" stroke="#e9e9ee"/>
    <circle cx="584" cy="309" r="4" stroke="#FACC15"/>
    <!-- espinilla -->
    <rect x="700" y="120" width="42" height="222" rx="10" stroke="#FACC15" fill="#16161e"/>
    <circle cx="721" cy="144" r="5" stroke="#e9e9ee"/>
    <circle cx="721" cy="324" r="5" stroke="#e9e9ee"/>
  </g>
  <!-- cotas -->
  <g stroke="#9a9aa6" stroke-width="1.5">
    <line x1="100" y1="250" x2="400" y2="250"/><line x1="100" y1="244" x2="100" y2="256"/><line x1="400" y1="244" x2="400" y2="256"/>
    <line x1="40" y1="118" x2="460" y2="118"/>
    <line x1="472" y1="130" x2="472" y2="235"/>
    <line x1="40" y1="556" x2="460" y2="556"/>
    <line x1="472" y1="300" x2="472" y2="540"/>
    <line x1="630" y1="144" x2="630" y2="309"/><line x1="624" y1="144" x2="636" y2="144"/><line x1="624" y1="309" x2="636" y2="309"/>
    <line x1="756" y1="144" x2="756" y2="324"/><line x1="750" y1="144" x2="762" y2="144"/><line x1="750" y1="324" x2="762" y2="324"/>
  </g>
  <g fill="#e9e9ee" font-size="15">
    <text x="40" y="112">Pared lateral (corte 2) · 140 × 35</text>
    <text x="478" y="188">35</text>
    <text x="250" y="272" text-anchor="middle">100 entre ejes de la cadera</text>
    <text x="152" y="215" fill="#60a5fa" font-size="14">ventana del servo 23 × 12,5</text>
    <text x="40" y="292">Base (corte 1) · 140 × 80</text>
    <text x="478" y="425">80</text>
    <text x="250" y="576" text-anchor="middle">140</text>
    <text x="250" y="430" fill="#60a5fa" font-size="14" text-anchor="middle">Arduino Uno 68,6 × 53,3</text>
    <text x="250" y="450" fill="#9a9aa6" font-size="14" text-anchor="middle">4 orificios M3 en los orificios de la placa</text>
    <text x="554" y="112">Muslo (4) · 20 × 82</text>
    <text x="638" y="232">55</text>
    <text x="700" y="112" fill="#e9e9ee">Tibia (4) · 14 × 74</text>
    <text x="764" y="240">60</text>
    <text x="608" y="388" fill="#9a9aa6" font-size="14" text-anchor="middle">ventana del servo</text>
    <text x="608" y="406" fill="#9a9aa6" font-size="14" text-anchor="middle">de la rodilla</text>
    <text x="721" y="364" fill="#9a9aa6" font-size="14" text-anchor="middle">pie (M3 +</text>
    <text x="721" y="382" fill="#9a9aa6" font-size="14" text-anchor="middle">puntera)</text>
  </g>
  <!-- leyenda -->
  <g font-size="14" fill="#9a9aa6">
    <circle cx="48" cy="610" r="5" fill="none" stroke="#FACC15" stroke-width="2"/><text x="62" y="615">eje del servo (centro de giro)</text>
    <circle cx="300" cy="610" r="5" fill="none" stroke="#e9e9ee" stroke-width="2"/><text x="314" y="615">orificio para el brazo (horn) o tornillo</text>
    <rect x="42" y="632" width="14" height="10" fill="none" stroke="#60a5fa" stroke-width="2"/><text x="62" y="642">ventana donde encaja el servo (el eje queda a 6 mm de un extremo)</text>
  </g>
  <!-- panel -->
  <g transform="translate(830,120)">
    <rect width="330" height="560" rx="14" fill="#16161e" stroke="#272730" stroke-width="1.5"/>
    <text x="22" y="38" fill="#FACC15" font-size="18" font-weight="700">MG90S (típico)</text>
    <g fill="#e9e9ee" font-size="15">
      <text x="22" y="70">cuerpo 22,8 × 12,2 × 28,5</text>
      <text x="22" y="96">pestañas de extremo a extremo 32,5</text>
      <text x="22" y="122">orificios de las pestañas: 27,8 entre centros</text>
      <text x="22" y="148">eje a ~6 del extremo del cuerpo</text>
      <text x="22" y="174">torque ~2,2 kg·cm a 6 V</text>
    </g>
    <text x="22" y="220" fill="#FACC15" font-size="18" font-weight="700">Cómo se conectan las piezas</text>
    <g fill="#e9e9ee" font-size="15">
      <text x="22" y="252">1. Servo de la cadera en la ventana de la</text>
      <text x="22" y="274">   pared, con el eje hacia afuera.</text>
      <text x="22" y="302">2. Brazo (horn) de una punta atornillado</text>
      <text x="22" y="324">   a la parte superior del muslo (2 tornillos M2).</text>
      <text x="22" y="352">3. Servo de la rodilla en la ventana del muslo.</text>
      <text x="22" y="380">4. Horn de la rodilla arriba de la tibia.</text>
      <text x="22" y="408">5. Paredes fijadas a la base con</text>
      <text x="22" y="430">   escuadras o pegamento, en L.</text>
    </g>
    <text x="22" y="476" fill="#9a9aa6" font-size="14">¿Cambiaste 55 o 60? Cambia L1 y L2</text>
    <text x="22" y="496" fill="#9a9aa6" font-size="14">en firmware/robo4/robo4.ino.</text>
    <text x="22" y="530" fill="#9a9aa6" font-size="14">Peso objetivo armado: 350–450 g.</text>
  </g>
  <g id="cotas" font-size="14" fill="#e9e9ee">
    <text x="40" y="680" fill="#FACC15" font-size="16" font-weight="700">Cotas para marcar (mm, desde la esquina superior izquierda de cada pieza)</text>
    <text x="40" y="706">Pared: ejes a 20 y a 120 del extremo, 20 debajo del borde superior. Ventana 23 × 12,5, de altura 13,75 a 26,25; el eje queda a 6 del extremo de la</text>
    <text x="40" y="726">ventana más cercano al extremo de la pared.</text>
    <text x="40" y="750">Pestañas del servo de la cadera: orificios M2 a 11,5 y 39,3 (servo trasero) y a 100,7 y 128,5 (servo delantero), a la altura del eje.</text>
    <text x="40" y="774">Base: Uno centrado, esquina de la placa en (35,7; 13,4). Orificios del Uno desde esa esquina: (14,0; 2,5) (15,3; 50,7) (66,1; 7,6) (66,1; 35,5).</text>
    <text x="40" y="794">Separadores M3 de 25 mm: el Uno queda encima de los servos de la cadera.</text>
    <text x="40" y="818">Muslo: orificio del horn a 8 del borde superior, centrado. Eje de la rodilla a 63 del borde superior; ventana de 46,2 a 69 (el cuerpo del servo sube</text>
    <text x="40" y="838">por el muslo, eje abajo); orificios M2 de las pestañas a 43,7 y 71,5.</text>
    <text x="40" y="862">Tibia: horn a 8 del borde superior, orificio del pie 60 más abajo (6 del borde inferior).</text>
  </g>
</svg>