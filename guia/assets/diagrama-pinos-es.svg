<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Inter, Arial, sans-serif">
  <title>Mapa de las patas y pines del robo4 (vista superior)</title>
  <rect width="1000" height="700" rx="16" fill="#0c0c10"/>
  <text x="40" y="52" fill="#e9e9ee" font-size="28" font-weight="700" font-family="Sora, Inter, sans-serif">Mapa de las patas (vista superior)</text>
  <text x="40" y="82" fill="#9a9aa6" font-size="16">Número de la pata en el código · pin de la cadera / pin de la rodilla · señal del servo</text>

  <!-- frente -->
  <text x="500" y="128" fill="#FACC15" font-size="17" font-weight="700" text-anchor="middle">▲ FRENTE</text>
  <!-- cuerpo -->
  <rect x="380" y="150" width="240" height="420" rx="18" fill="#16161e" stroke="#9a9aa6" stroke-width="2"/>
  <rect x="420" y="250" width="160" height="210" rx="10" fill="#101a2b" stroke="#3b82f6" stroke-width="2"/>
  <text x="500" y="345" fill="#e9e9ee" font-size="16" text-anchor="middle">Uno +</text>
  <text x="500" y="367" fill="#e9e9ee" font-size="16" text-anchor="middle">Sensor Shield</text>
  <text x="500" y="540" fill="#9a9aa6" font-size="14" text-anchor="middle">batería abajo</text>

  <!-- caderas (servos) -->
  <g fill="#1e3a8a" stroke="#60a5fa" stroke-width="2">
    <rect x="350" y="170" width="56" height="40" rx="6"/>
    <rect x="594" y="170" width="56" height="40" rx="6"/>
    <rect x="350" y="510" width="56" height="40" rx="6"/>
    <rect x="594" y="510" width="56" height="40" rx="6"/>
  </g>
  <!-- patas -->
  <g stroke="#9a9aa6" stroke-width="10" stroke-linecap="round">
    <line x1="350" y1="190" x2="290" y2="190"/>
    <line x1="650" y1="190" x2="710" y2="190"/>
    <line x1="350" y1="530" x2="290" y2="530"/>
    <line x1="650" y1="530" x2="710" y2="530"/>
  </g>

  <!-- tarjetas -->
  <g font-size="16">
    <g transform="translate(40,140)">
      <rect width="240" height="104" rx="12" fill="#16161e" stroke="#FACC15" stroke-width="2"/>
      <text x="16" y="32" fill="#FACC15" font-size="19" font-weight="700">0 · FE</text>
      <text x="80" y="32" fill="#9a9aa6" font-size="15">frente izquierda</text>
      <text x="16" y="62" fill="#e9e9ee">cadera D2 · señal +1</text>
      <text x="16" y="88" fill="#e9e9ee">rodilla  D3 · señal −1</text>
    </g>
    <g transform="translate(720,140)">
      <rect width="240" height="104" rx="12" fill="#16161e" stroke="#FACC15" stroke-width="2"/>
      <text x="16" y="32" fill="#FACC15" font-size="19" font-weight="700">1 · FD</text>
      <text x="80" y="32" fill="#9a9aa6" font-size="15">frente derecha</text>
      <text x="16" y="62" fill="#e9e9ee">cadera D4 · señal −1</text>
      <text x="16" y="88" fill="#e9e9ee">rodilla  D5 · señal +1</text>
    </g>
    <g transform="translate(40,478)">
      <rect width="240" height="104" rx="12" fill="#16161e" stroke="#FACC15" stroke-width="2"/>
      <text x="16" y="32" fill="#FACC15" font-size="19" font-weight="700">2 · TE</text>
      <text x="80" y="32" fill="#9a9aa6" font-size="15">atrás izquierda</text>
      <text x="16" y="62" fill="#e9e9ee">cadera D6 · señal +1</text>
      <text x="16" y="88" fill="#e9e9ee">rodilla  D7 · señal −1</text>
    </g>
    <g transform="translate(720,478)">
      <rect width="240" height="104" rx="12" fill="#16161e" stroke="#FACC15" stroke-width="2"/>
      <text x="16" y="32" fill="#FACC15" font-size="19" font-weight="700">3 · TD</text>
      <text x="80" y="32" fill="#9a9aa6" font-size="15">atrás derecha</text>
      <text x="16" y="62" fill="#e9e9ee">cadera D8 · señal −1</text>
      <text x="16" y="88" fill="#e9e9ee">rodilla  D9 · señal +1</text>
    </g>
  </g>
  <text x="40" y="630" fill="#e9e9ee" font-size="16">Pares del trote: <tspan fill="#FACC15" font-weight="700">FE + TD</tspan> suben juntos, luego <tspan fill="#FACC15" font-weight="700">FD + TE</tspan>.</text>
  <text x="40" y="660" fill="#9a9aa6" font-size="15">El lado derecho está invertido, por eso la señal cambia. Si una articulación gira al revés, cambia la señal en SENTIDO[][] en el código.</text>
</svg>